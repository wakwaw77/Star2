  <style>
    body { background:#000; margin:0; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; }
  .player { width:95%; max-width:430px; height:240px; background:#111; border-radius:16px; position:relative; overflow:hidden; cursor:pointer; background-image: url('https://picsum.photos/430/240?blur=3'); background-size:cover; background-position:center; }
  .overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; }
  .play-circle { width:75px; height:75px; background:rgba(255,255,255,0.95); border-radius:50%; display:flex; justify-content:center; align-items:center; box-shadow:0 0 20px rgba(0,0,0,0.6); animation: pulse 1.5s infinite; }
   @keyframes pulse { 0% { transform:scale(1); } 50% { transform:scale(1.05); } 100% { transform:scale(1); } }
  .play-tri { width:0; height:0; border-left:20px solid #ff8c00; border-top:12px solid transparent; border-bottom:12px solid transparent; margin-left:4px; }
  .controls { position:absolute; bottom:0; left:0; width:100%; height:40px; background:linear-gradient(transparent, rgba(0,0,0,0.8)); display:flex; align-items:center; padding:0 12px; box-sizing:border-box; justify-content:space-between; color:#fff; font-size:12px; }
  .bar { position:absolute; bottom:40px; left:0; width:100%; height:3px; background:rgba(255,255,255,0.3); }
  .bar-fill { width:35%; height:100%; background:#ff8c00; }
    p { color:#999; margin-top:15px; font-size:13px; }
  </style>

<body>

  <div class="player" onclick="go()">
    <div class="overlay">
      <div class="play-circle"><div class="play-tri"></div></div>
    </div>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="controls">
      <span>▶ 0:12 / 2:34</span>
      <span>⛶</span>
    </div>
  </div>
  <p>Klik untuk memutar video</p>
